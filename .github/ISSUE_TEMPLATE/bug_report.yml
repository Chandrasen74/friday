name: Bug report
description: Report a problem with FRIDAY
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device, Android version, app version/commit, build type.
      placeholder: "Pixel 7, Android 15, debug APK from commit ..."
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant logcat output or screenshots (remove sensitive data).
      render: text
