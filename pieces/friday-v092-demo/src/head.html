<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRIDAY v0.9.2 feature demo</title>
<style>
  /* Exactly two bundled faces (film rule): Orbitron = the app's own display ttf,
     Roboto = stand-in for the platform SansSerif/Monospace families (documented). */
  @font-face { font-family: "Orbitron"; src: url(fonts/orbitron_bold.ttf) format("truetype"); font-weight: 400 700; font-style: normal; font-synthesis: none; }
  @font-face { font-family: "Roboto"; src: url(fonts/roboto-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "Roboto"; src: url(fonts/roboto-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-style: normal; }
  @font-face { font-family: "Roboto"; src: url(fonts/roboto-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-style: normal; }
  @font-face { font-family: "Roboto"; src: url(fonts/roboto-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-style: normal; }
  html, body { margin: 0; height: 100%; background: #09090C; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #c { max-width: 100vw; max-height: 100vh; width: auto; height: auto; display: block; cursor: pointer;
       font-feature-settings: "tnum" 1; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// FRIDAY v0.9.2 - deterministic 30fps, 1560 frames, 52.0s, 9:16. Own score: A minor, 120 BPM, offset 0.
// Bar = 2.0s. Beat boundaries on the bar grid: 0/4/8/12/18/22/28/32/36/42/46/52.
// Exactly one structural hard cut: HUD reveal at 22.0s = frame 660. Every other boundary is a
// match cut that carries one element across (authored in scenes; the renderer cuts by era).
const FORMATS = { '9:16': [1080, 1920], '4:5': [1080, 1350], '1:1': [1080, 1080], '16:9': [1920, 1080] };
const FORMAT = new URLSearchParams(location.search).get('format') || '9:16';
const FPS = 30, [W, H] = FORMATS[FORMAT];
{ const cv = document.getElementById('c'); cv.width = W; cv.height = H; }
const BPM = 120, GRID0 = 0;
const BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, BAR = 4 * BEAT;
const DURATION = 52.0, NFRAMES = 1560, LOOP_T = DURATION;
const SAFE = { '9:16': { top: 250, bottom: 420, right: 140 }, '4:5': { top: 80, bottom: 160, right: 60 },
               '1:1': { top: 60, bottom: 110, right: 60 }, '16:9': { top: 60, bottom: 110, right: 60 } }[FORMAT];
const F_ORB = 'Orbitron', F_ROB = 'Roboto';
const CX = W / 2;

// Bar-grid beats (start-inclusive, end-exclusive), seconds; frame = t * FPS exactly.
const BEATS_DEF = [
  { id: 1,  t0: 0,  t1: 4,  caption: 'Instant on your phone.' },
  { id: 2,  t0: 4,  t1: 8,  caption: 'Everything ready locally.' },
  { id: 3,  t0: 8,  t1: 12, caption: 'One clean send.' },
  { id: 4,  t0: 12, t1: 18, caption: 'Alive while thinking.' },
  { id: 5,  t0: 18, t1: 22, caption: 'Every run, measured.' },
  { id: 6,  t0: 22, t1: 28, caption: 'Open the HUD.' },
  { id: 7,  t0: 28, t1: 32, caption: 'Tuned for this device.' },
  { id: 8,  t0: 32, t1: 36, caption: 'Clarity at every layer.' },
  { id: 9,  t0: 36, t1: 42, caption: 'Metrics survive relaunch.' },
  { id: 10, t0: 42, t1: 46, caption: 'Crafted in v0.9.2.' },
  { id: 11, t0: 46, t1: 52, caption: 'on-device, by design.' },
];
const CUT_HUD = 22.0, CUT_FRAME = 660;
const CARRY_CUTS = [4, 8, 12, 18, 28, 32, 36, 42, 46];   // match-cut boundaries (one carried element each)

const ERA_LIST = [
  [BEATS_DEF[0].t0, BEATS_DEF[0].t1, () => sceneBoot()],
  [BEATS_DEF[1].t0, BEATS_DEF[1].t1, () => sceneModels()],
  [BEATS_DEF[2].t0, BEATS_DEF[2].t1, () => sceneCompose()],
  [BEATS_DEF[3].t0, BEATS_DEF[3].t1, () => sceneStream()],
  [BEATS_DEF[4].t0, BEATS_DEF[4].t1, () => sceneFooter()],
  [BEATS_DEF[5].t0, BEATS_DEF[5].t1, () => sceneHud()],
  [BEATS_DEF[6].t0, BEATS_DEF[6].t1, () => sceneTip()],
  [BEATS_DEF[7].t0, BEATS_DEF[7].t1, () => sceneSettings()],
  [BEATS_DEF[8].t0, BEATS_DEF[8].t1, () => scenePersist()],
  [BEATS_DEF[9].t0, BEATS_DEF[9].t1, () => sceneCraft()],
  [BEATS_DEF[10].t0, BEATS_DEF[10].t1, () => sceneLockup()],
];

const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES,
  loop: LOOP_T, safe: SAFE, aspect: FORMAT, format: 'morph-chain',
  beats: BEATS_DEF,
  shots: BEATS_DEF.map((b, i) => ({ id: i + 1, key: String(b.id), era: i, t0: b.t0, t1: b.t1, title: b.caption, caption: b.caption })),
  cuts: [4, 8, 12, 18, CUT_HUD, 28, 32, 36, 42, 46],
  cutFrames: [120, 240, 360, 540, CUT_FRAME, 840, 960, 1080, 1260, 1380],
  morphs: [],
  transitions: [
    { from: 1, to: 2, type: 'cut', t: 4, frame: 120, carry: 'scan tick -> selected row bar' },
    { from: 2, to: 3, type: 'cut', t: 8, frame: 240, carry: 'bar extension -> capsule border ignition' },
    { from: 3, to: 4, type: 'cut', t: 12, frame: 360, carry: 'SEND pill rect -> STOP pill rect' },
    { from: 4, to: 5, type: 'cut', t: 18, frame: 540, carry: 'footer element rect' },
    { from: 5, to: 6, type: 'hard-cut', t: CUT_HUD, frame: CUT_FRAME, carry: 'hero counter rect' },
    { from: 6, to: 7, type: 'cut', t: 28, frame: 840, carry: 'amber dot position' },
    { from: 7, to: 8, type: 'cut', t: 32, frame: 960, carry: 'button rect -> settings top bar' },
    { from: 8, to: 9, type: 'cut', t: 36, frame: 1080, carry: 'relaunch seam line' },
    { from: 9, to: 10, type: 'cut', t: 42, frame: 1260, carry: 'hairline top -> diagnostics top edge' },
    { from: 10, to: 11, type: 'cut', t: 46, frame: 1380, carry: 'contract point -> facet centre' },
  ],
  cues: {
    lock1: 0.5, wipe: 0.7, wipeEnd: 2.1, tick: 1.0, cap1: 2.3,
    pings: [4.5, 5.25, 6.0, 6.75], chips: [5.0, 5.75, 6.5], barGrow: 7.6, cap2: 4.6,
    ignite: 8.0, typed: 9.0, press: 10.3, send: 10.6, land: 11.4, cap3: 8.5,
    reveal: 12.6, short: 13.5, sweep: 15.5, footerDrop: 17.4, cap4: 13.0,
    count: 18.6, swap: 19.8, lock: 20.0, cap5: 18.8,
    hit: 22.0, cards: 23.4, cpu: 26.2, cap6: 22.6,
    tap: 30.2, expand: 30.9, cap7: 28.6,
    ticks: [33.0, 34.0, 35.0], seam: 35.7, cap8: 32.6,
    align: 36.1, hairline: 38.0, lift: 39.8, cap9: 36.6,
    v092: 42.4, contract: 45.2, cap10: 42.8,
    gather: 46.1, lockup: 48.0, wordmark: 48.15, tagline: 48.55, scan2: 49.7,
  },
  acts: [
    { name: '1 Hook+Local', role: 'journey', t0: 0, t1: 20 },
    { name: '2 Silence', role: 'silence', t0: 20, t1: 22 },
    { name: '3 HUD payoff', role: 'gift', t0: 22, t1: 28 },
    { name: '4 Lockup', role: 'goodbye', t0: 46, t1: 52 },
  ],
  board: [
    { t: 2.6,  title: 'Instant on your phone.',    sound: 'impact at 0, tick-lock at 1',                 next: 'scan tick lands on the selected row bar' },
    { t: 6.4,  title: 'Everything ready locally.', sound: 'glass pings per row, model chips',            next: 'bar extension runs into the composer' },
    { t: 10.4, title: 'One clean send.',           sound: 'soft click at press, whoosh on send',         next: 'pill rect carried to the STOP pill' },
    { t: 15.8, title: 'Alive while thinking.',     sound: 'shimmer pad swell',                           next: 'footer element drops into place' },
    { t: 20.6, title: 'Every run, measured.',      sound: 'riser then near-silence 20-22s',              next: 'hard cut, hero counter persists' },
    { t: 24.6, title: 'Open the HUD.',             sound: 'loudest hit of the film at 22.0',             next: 'amber dot carried to the tip card' },
    { t: 30.4, title: 'Tuned for this device.',    sound: 'warm confirm at the tap',                     next: 'button rect becomes the settings top bar' },
    { t: 34.4, title: 'Clarity at every layer.',   sound: 'sparse pitched ticks per row',                next: 'list collapses into the relaunch seam' },
    { t: 39.6, title: 'Metrics survive relaunch.', sound: 'opening motif returns',                       next: 'hairline lifts into the diagnostics edge' },
    { t: 44.2, title: 'Crafted in v0.9.2.',        sound: 'harmonic lift',                               next: 'everything contracts to the logo point' },
    { t: 49.6, title: 'on-device, by design.',     sound: 'resolve at 48.0, fade',                       next: 'hold with the scan sweep' },
  ],
  narration: [],
  assertTimeline: function () {
    if (this.frames !== 1560 || this.fps !== 30 || this.duration !== 52.0) throw new Error('timeline spec mismatch');
    if (this.cuts.length !== 10 || this.cuts[4] !== 22.0) throw new Error('cut list mismatch');
    for (const c of this.cuts) {           // every boundary on the bar grid (2.0s), frame-exact
      if (Math.abs(c / BAR - Math.round(c / BAR)) > 1e-9) throw new Error('cut off the bar grid: ' + c);
      if (Math.round(c * FPS) !== c * FPS) throw new Error('cut not frame-exact: ' + c);
    }
    const hard = this.transitions.filter((t) => t.type === 'hard-cut');
    if (hard.length !== 1 || hard[0].t !== 22.0 || hard[0].frame !== 660) throw new Error('hard cut must be 22.0s/frame 660');
    for (const b of this.beats) {
      const wc = b.caption.trim().split(/\s+/).length;
      if (wc < 3 || wc > 5) throw new Error('caption word count: ' + b.caption);
      if (Math.abs(b.t0 / BAR - Math.round(b.t0 / BAR)) > 1e-9) throw new Error('beat off the bar grid: ' + b.t0);
    }
    return true;
  },
};
window.TIMELINE = TIMELINE;
TIMELINE.assertTimeline();

// Ground tokens (app theme) + the one accent (the app's cyan).
const COL = {
  void: '#09090C', base: '#0E0E13', surf: '#15151C', elev: '#1C1C25',
  cyan: '#38BDF8', cyan2: '#7DD3FC', cyanDim: '#0284C7',
  white: '#F4F4F6', text: '#EAEAF0', text2: '#A1A1AA', text3: '#63636E',
};
function fillGround() { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = COL.void; ctx.fillRect(0, 0, W, H); ctx.restore(); }
